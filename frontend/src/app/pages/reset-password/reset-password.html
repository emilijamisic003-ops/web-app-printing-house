<div class="container recovery-page">
  <section class="recovery-card" aria-labelledby="reset-title">
    <p class="eyebrow">Printing House</p>
    <h1 id="reset-title">Postavite novu lozinku</h1>
    <p class="introduction">Unesite novu lozinku i ponovite je radi potvrde. Oba polja su obavezna.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="reset-title">
      <div class="field">
        <label for="new-password">Nova lozinka</label>
        <input id="new-password" type="password" formControlName="newPassword" autocomplete="new-password" required
          [attr.aria-invalid]="!!error('newPassword')" aria-describedby="password-hint new-password-error">
        <p class="hint" id="password-hint">8–12 karaktera. Počinje slovom; sadrži veliko slovo, broj i specijalni karakter.</p>
        <p class="error" id="new-password-error" aria-live="polite">{{ error('newPassword') }}</p>
      </div>
      <div class="field">
        <label for="confirm-password">Potvrdite novu lozinku</label>
        <input id="confirm-password" type="password" formControlName="confirmPassword" autocomplete="new-password" required
          [attr.aria-invalid]="!!error('confirmPassword')" aria-describedby="confirm-password-error">
        <p class="error" id="confirm-password-error" aria-live="polite">{{ error('confirmPassword') }}</p>
      </div>
      <button type="submit">Postavi novu lozinku</button>
      <p class="status" role="status">{{ statusMessage }}</p>
    </form>
    <a class="back-link" routerLink="/login">Nazad na prijavu</a>
  </section>
</div>
